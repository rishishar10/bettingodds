name: Nightly board

on:
  schedule:
    # 11:05pm Pacific builds the next day's board: 06:05 UTC in summer, 07:05 UTC in winter.
    # Whichever run is early or late sees "before the build" or "already published" and stops.
    - cron: "5 6 * * *"
    - cron: "5 7 * * *"
  workflow_dispatch:

concurrency:
  group: board-state
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CAPTURES_ENABLED: ${{ vars.CAPTURES_ENABLED }}
      ODDS_PAID_PLAN: ${{ vars.ODDS_PAID_PLAN }}
      REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/ci/data-branch.sh pull
      - name: Box-score history (first run ingests two seasons)
        run: node scripts/ci/ensure-history.ts
      - name: Refresh box scores through today
        run: node scripts/ingest-boxscores.ts --recent 3
      - run: scripts/ci/mode.sh
      - name: Build the board and grade earlier ones
        run: |
          case "$MODE" in
            live)   node scripts/run-board.ts; node scripts/grade.ts ;;
            dryrun) node scripts/run-board.ts --dry-run; node scripts/grade.ts --dry-run ;;
          esac
          # Practice board every night in every mode: free, and it keeps the model check growing.
          node scripts/demo-snapshot.ts data/demo-published
          node scripts/grade.ts --dir data/demo-published
      - name: Save state
        if: always()
        run: scripts/ci/data-branch.sh push
      - name: Build site
        run: npm run build
        env:
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          BOARD_DATA_DIR: ${{ env.BOARD_DIR }}
          PRACTICE_DATA_DIR: data/demo-published
      - if: vars.PAGES_ENABLED == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - if: vars.PAGES_ENABLED == '1'
        uses: actions/deploy-pages@v4
