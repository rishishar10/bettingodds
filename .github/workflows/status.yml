name: Status watch

on:
  schedule:
    # Hourly at :15 from 9:15am to about midnight Pacific: injury news before games,
    # grading and the running total as games end.
    - cron: "15 16-23 * * *"
    - cron: "15 0-7 * * *"
  workflow_dispatch:

concurrency:
  group: board-state
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/ci/data-branch.sh pull
      - run: scripts/ci/mode.sh
      - name: Watch injury news and re-run the board for games not yet tipped
        run: node scripts/status-watch.ts --dir "$BOARD_DIR"
      - name: Grade finished games and update the running total
        run: |
          node scripts/ingest-boxscores.ts --recent 1
          case "$MODE" in
            live)   node scripts/grade.ts; node scripts/live-scorecard.ts ;;
            dryrun) node scripts/grade.ts --dry-run; node scripts/live-scorecard.ts --dry-run ;;
          esac
          node scripts/grade.ts --dir data/demo-published
      - run: scripts/ci/data-branch.sh push
      - name: Build site
        run: npm run build
        env:
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          BOARD_DATA_DIR: ${{ env.BOARD_DIR }}
          PRACTICE_DATA_DIR: data/demo-published
      - if: vars.PAGES_ENABLED == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - if: vars.PAGES_ENABLED == '1'
        uses: actions/deploy-pages@v4
