name: Morning board

on:
  schedule:
    # 8:00am Pacific is 15:00 UTC in summer and 16:00 UTC in winter; the job skips the early one.
    - cron: "5 15 * * *"
    - cron: "5 16 * * *"
  workflow_dispatch:

concurrency:
  group: board-state
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CAPTURES_ENABLED: ${{ vars.CAPTURES_ENABLED }}
      REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/ci/data-branch.sh pull
      - name: Box-score history (first run ingests two seasons)
        run: node scripts/ci/ensure-history.ts
      - name: Refresh recent box scores
        run: node scripts/ingest-boxscores.ts --recent 3
      - run: scripts/ci/mode.sh
      - name: Build the board
        run: |
          case "$MODE" in
            live)   node scripts/run-board.ts && node scripts/grade.ts ;;
            dryrun) node scripts/run-board.ts --dry-run && node scripts/grade.ts --dry-run ;;
            demo)   if [ "$(TZ=America/Los_Angeles date +%H)" -ge 8 ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
                      rm -rf data/demo-published && node scripts/demo-snapshot.ts data/demo-published; fi ;;
          esac
      - name: Save state
        if: always()
        run: scripts/ci/data-branch.sh push
      - name: Build site
        run: npm run build
        env:
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          BOARD_DATA_DIR: ${{ env.BOARD_DIR }}
      - if: vars.PAGES_ENABLED == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - if: vars.PAGES_ENABLED == '1'
        uses: actions/deploy-pages@v4
